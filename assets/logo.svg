<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ShipToday Forge logo">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="barRight" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2f6df0"/>
      <stop offset="100%" stop-color="#5a9bff"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- three ascending, forward-slanted bars -->
  <g>
    <!-- left / darkest / shortest -->
    <polygon points="132,255 154,255 178,212 156,212" fill="#1b3a8f"/>
    <!-- middle / medium -->
    <polygon points="170,255 192,255 222,185 200,185" fill="#2f5fd6"/>
    <!-- right / brightest / tallest -->
    <polygon points="208,255 230,255 268,156 246,156" fill="url(#barRight)"/>
  </g>
</svg>
